name: Bug report
description: Report a reproducible bug without sharing private chat data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real Telegram exports, private screenshots, phone numbers, Telegram IDs, or private messages.
  - type: textarea
    id: description
    attributes:
      label: 問題描述
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: Use synthetic data only.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 126, Safari 18, Firefox 128
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS, Windows, Linux, iOS, Android
  - type: input
    id: file-size
    attributes:
      label: 檔案規模
      placeholder: Approximate file size and message count, no private data
  - type: textarea
    id: console
    attributes:
      label: Console 錯誤
      description: Remove private paths, names, and message content.
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: I did not upload real chat exports, private screenshots, phone numbers, Telegram IDs, or private messages.
          required: true
