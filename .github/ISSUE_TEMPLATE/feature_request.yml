name: Feature request
description: Suggest an improvement with privacy impact considered.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: 功能需求
      description: What would you like TG Chat Footprint to do?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用情境
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 建議行為
  - type: textarea
    id: privacy
    attributes:
      label: 隱私影響
      description: Does this require any network request, storage, or new data exposure?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
